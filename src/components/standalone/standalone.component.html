<div class="showcase">
  <!-- ===================================================== -->
  <section>
    <h2>Default</h2>
    <ds-text-input label="Search" placeholder="Search products..." />
  </section>

  <!-- ===================================================== -->
  <section>
    <h2>Sizes</h2>
    <div class="row">
      <ds-text-input size="sm" label="Small" placeholder="Small input" />
      <ds-text-input size="md" label="Medium" placeholder="Medium input" />
      <ds-text-input size="lg" label="Large" placeholder="Large input" />
    </div>
  </section>

  <!-- ===================================================== -->
  <section>
    <h2>Layouts</h2>
    <div class="column">
      <ds-text-input label="Stacked (default)" placeholder="Stacked layout" />

      <ds-text-input label="Inline" placeholder="Inline layout" layout="inline" />

      <ds-text-input label="Floating" layout="floating" />
    </div>
  </section>

  <!-- ===================================================== -->
  <section>
    <h2>Floating Sizes</h2>
    <div class="column">
      <ds-text-input label="Floating Small" size="sm" layout="floating" />
      <ds-text-input label="Floating Medium" size="md" layout="floating" />
      <ds-text-input label="Floating Large" size="lg" layout="floating" />
    </div>
  </section>

  <!-- ===================================================== -->
  <section>
    <h2>States</h2>
    <div class="column">
      <ds-text-input label="With Hint" hint="Helpful guidance" />

      <ds-text-input label="Error state" error="Something went wrong" />

      <ds-text-input label="Disabled" value="Disabled value" [disabled]="true" />

      <ds-text-input label="Readonly" value="Readonly value" [readonly]="true" />
    </div>
  </section>

  <!-- ===================================================== -->
  <section>
    <h2>Custom Class</h2>
    <ds-text-input label="Custom styled" value="Hello world" class="custom-input" />
  </section>
</div>
