<main class="main" role="main" [attr.data-theme]="theme">
  <div class="content">
    <div class="header">
      <h1>Design System Components</h1>
      <p>Explore the components in light and dark themes.</p>
      <label class="switch">
        <input type="checkbox" (change)="toggleTheme()" />
        <span class="slider round"></span>
      </label>
    </div>

    <ds-standalone />
    <ds-form />
  </div>
</main>
