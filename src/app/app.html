<main class="main">
  <div class="content">
    <div class="example">
      <h2>Standalone search input</h2>
      <ds-text-input
        label="Search"
        placeholder="Search products..."
        hint="Type a keyword and press enter"
        (valueChange)="onSearchChange($event)"
      />

      <p>Searching for: {{ searchTerm() }}</p>
    </div>

    <div class="example">
      <h2>Email form with validation</h2>
      <form [formGroup]="emailForm" (ngSubmit)="submit()">
        <ds-text-input
          formControlName="email"
          type="email"
          label="Email"
          placeholder="Enter your email"
          hint="hello@example.com"
          [required]="true"
          [error]="emailError"
        />
        <ds-text-input
          formControlName="password"
          type="password"
          label="Password"
          placeholder="Enter your password"
          hint="Minimum 6 letters"
          [required]="true"
          [error]="passwordError"
        />
        <button type="submit" [disabled]="emailForm.invalid">Submit</button>
      </form>

      <p>Email: {{ emailControl?.value }}</p>
      <p>Password: {{ passwordControl?.value }}</p>
    </div>
  </div>
</main>
